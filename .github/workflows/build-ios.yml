name: Build iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r GeoBusca-IFTO.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GeoBusca-IFTO-IPA
          path: ios/App/GeoBusca-IFTO.ipa
